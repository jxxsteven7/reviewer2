name: Bug report
description: Something on the site, in a game or in the code doesn't work as it should.
title: 'Bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Write in English or Chinese, whichever is easier for you.

        **Playing, not coding?** Use **Send feedback**, at the foot of the home page and of every room: it needs no GitHub account, sends the version and your browser along, and an adopted report counts for your account on the site.

        This issue is public. Leave out passwords, contacts, other players' names and room codes, and crop them out of screenshots.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [open bugs](https://github.com/jxxsteven7/reviewer2/issues?q=is%3Aissue%20is%3Aopen%20label%3Abug), and this one isn't there yet.
          required: true
        - label: This issue is about one bug. I'll open another issue for each other bug.
          required: true
        - label: It doesn't name the commercial board game that the first game is based on, and holds nothing private.
          required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - On playreviewer2.com
        - On a copy I run from the code
        - In the tests or in CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: On the site, the version is at the foot of the home page. On your own copy, give the commit (`git rev-parse --short HEAD`).
      placeholder: v0.1.40
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      placeholder: After my phone's screen locked during a game, I came back as a spectator instead of the Blue group's PI.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: To be back in my seat, as the Blue group's PI.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that someone else can follow. Say how many players were in the room, and each one's role.
      placeholder: |
        1. Create a room on one phone and join it from three others.
        2. Start a game, with me as the Blue group's PI.
        3. Let my screen lock for a minute while the Red group guesses.
        4. Unlock it: the room lists me among the spectators.
    validations:
      required: true
  - type: dropdown
    id: repeats
    attributes:
      label: Does it happen again?
      options:
        - Every time
        - Sometimes
        - It happened once
        - I haven't tried again
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role when it happened
      multiple: true
      options:
        - PI
        - Student
        - Spectator
        - The room's chair
        - Not in a room
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Computer
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - WeChat's built-in browser
        - Safari
        - Chrome
        - Edge
        - Firefox
        - Another browser
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and browser versions
      placeholder: iOS 18.6, WeChat 8.0.60
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - Chinese
        - English
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: Anything from the browser's console or the server's log. It is shown as code.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Screenshots and anything else
      description: Paste or drag in screenshots or a screen recording. Crop out other players' names and room codes.
  - type: dropdown
    id: credit
    attributes:
      label: If it is adopted, list me on playreviewer2.com
      description: The site's home page lists adopted issues among its feedback contributions, linked to your GitHub page. Anonymously, the site names nobody, though this issue stays under your GitHub account. Code is credited by GitHub, among the repository's contributors.
      options:
        - By my GitHub username
        - As an anonymous player
      default: 0
    validations:
      required: true
