name: Idea
description: A new feature or a change, to the site, a game's rules or the AI players.
title: 'Idea: '
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Write in English or Chinese, whichever is easier for you.

        **Playing, not coding?** Use **Send feedback**, at the foot of the home page and of every room: it needs no GitHub account, and an adopted idea counts for your account on the site.

        A new game and the word lists have forms of their own, and so do changes to the code and the docs that players don't see. If you'd like to build the idea yourself, open this issue first, so that we agree on the plan before you write the code.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [ideas, open and closed](https://github.com/jxxsteven7/reviewer2/issues?q=is%3Aissue%20label%3Aidea), and this one isn't there yet.
          required: true
        - label: This issue is about one idea. I'll open another issue for each other idea.
          required: true
        - label: It doesn't name the commercial board game that the first game is based on.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options:
        - 'The site: rooms, accounts, friends and records'
        - The rules of a game
        - The AI players
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing or in the way, who runs into it, and when? A clear problem helps more than a finished solution.
      placeholder: A friend who joins after the game has started can only watch, and often leaves before the next game.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would it work for the players? Sketches are welcome.
      placeholder: Let a player who joins during a game take a student's seat in the group with fewer students.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought of
      placeholder: The chair could pause the game and move players between groups.
  - type: dropdown
    id: credit
    attributes:
      label: If it is adopted, list me on playreviewer2.com
      description: The site's home page lists adopted issues among its feedback contributions, linked to your GitHub page. Anonymously, the site names nobody, though this issue stays under your GitHub account. Code is credited by GitHub, among the repository's contributors.
      options:
        - By my GitHub username
        - As an anonymous player
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself and open a pull request.
