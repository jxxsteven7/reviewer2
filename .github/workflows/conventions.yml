# Checks the commit and versioning convention (docs/rules/git.md and docs/rules/versioning.md)
# with scripts/check-commits.mjs, and keeps the name of the board game the first game is based on
# out of the repository (docs/rules/constraints.md): scripts/check-commits.mjs refuses it in commit
# messages, pull request titles and bodies, and branch names, and scripts/check-names.mjs in files.
#
# On a pull request: every commit in it, plus the PR title and body. The title becomes the squash
# commit on main, so it must carry the next version. The job fills the version in when it is
# missing or stale, and only keeps a minor or major version that a maintainer chose. GitHub
# doesn't allow retitling a PR from a fork, so there the job fails and prints the title to use.
# On a push to main: the commits that just landed. Every new minor or major version on main gets
# a tag and a GitHub Release, including one that an earlier run missed. Then the open PRs get
# their versions refreshed, because every merge moves the next number on.
#
# PR metadata reaches the scripts only through `env:`. Never interpolate `github.event.*` into a
# `run:` script, which would allow script injection.

name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run at a time per pull request, where the newest wins. Runs on main never share a group:
  # GitHub also cancels a queued run when a newer one arrives, whatever cancel-in-progress says,
  # and a cancelled run on main could skip a release.
  group: conventions-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request:
    # This name is a required status check; see docs/maintainers.md.
    name: Commits and version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to put the right version in the PR title
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_ACTION: ${{ github.event.action }}
      TITLE_CHANGED: ${{ github.event.changes.title != null }}
      TITLE_BEFORE: ${{ github.event.changes.title.from }}
      ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version comes from the history of main and its tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Commits in the pull request
        run: node scripts/check-commits.mjs range "origin/$BASE_REF..$HEAD_SHA"
      - name: Pull request title and body
        run: |
          title="$(node scripts/check-commits.mjs pr-title --base "origin/$BASE_REF" --fix -- "$PR_TITLE")"

          # Only maintainers choose a minor or major version (docs/rules/versioning.md). Check
          # who put it in: the person who opened the PR, or who edited the title to a different
          # version. A later push or an edit that keeps the version leaves what a maintainer
          # chose, and the retitles this workflow makes with GITHUB_TOKEN keep the kind.
          version_set=false
          if [ "$EVENT_ACTION" = opened ]; then
            version_set=true
          elif [ "$EVENT_ACTION" = edited ] && [ "$TITLE_CHANGED" = true ] && [ "${TITLE_BEFORE%% *}" != "${PR_TITLE%% *}" ]; then
            version_set=true
          fi
          if [ "$version_set" = true ]; then
            patch="$(node scripts/check-commits.mjs pr-title --base "origin/$BASE_REF" --fix --patch -- "$PR_TITLE")"
            if [ "$title" != "$patch" ]; then
              role="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .role_name || echo none)"
              case "$role" in
                admin|maintain)
                  echo "$ACTOR is a maintainer and chose the version in: $title"
                  ;;
                *)
                  echo "::warning title=Version::Only maintainers choose a minor or major version. $ACTOR has the $role role, so the title gets the next patch version instead."
                  title="$patch"
                  ;;
              esac
            fi
          fi

          if [ "$title" != "$PR_TITLE" ]; then
            if gh pr edit "$PR_NUMBER" --title "$title"; then
              echo "Retitled the pull request: $title"
            else
              echo "::error title=Pull request title::Set the pull request title to: $title"
              exit 1
            fi
          fi
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/check-commits.mjs pr-title --base "origin/$BASE_REF" \
            --head-ref "$HEAD_REF" --body-file "$RUNNER_TEMP/pr-body.md" -- "$title"

  scripts:
    # This name is a required status check; see docs/maintainers.md.
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/*.test.mjs

  names:
    # The name of the board game the first game is based on must not appear anywhere
    # (docs/rules/constraints.md). scripts/check-names.mjs looks for it in every file and file
    # path. The commit messages, the pull request title and body, and the branch name are checked
    # by scripts/check-commits.mjs in the jobs for pull requests and for main.
    # This name is a required status check; see docs/maintainers.md.
    name: Forbidden name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Files and file paths
        run: node scripts/check-names.mjs files

  main:
    name: Landed commits and release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag a new minor or major version and publish its release
      pull-requests: write # to refresh the version in open PR titles
    env:
      BEFORE: ${{ github.event.before }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Commits that landed on main
        run: node scripts/check-commits.mjs head --base "$BEFORE"
      - name: Tag and release new minor and major versions
        # Also after a failed check: a version that landed on main is used up whether or not its
        # title is right, and the tags must match the history.
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-commits.mjs release > "$RUNNER_TEMP/releases.tsv"
          while IFS=$'\t' read -r tag sha; do
            if gh release create "$tag" --target "$sha" --title "$tag" --generate-notes; then
              echo "Released $tag"
            elif gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag was released by another run"
            else
              exit 1
            fi
          done < "$RUNNER_TEMP/releases.tsv"
      - name: Refresh the version in open pull request titles
        if: ${{ !cancelled() }}
        run: |
          gh pr list --base main --state open --limit 500 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' > "$RUNNER_TEMP/open-prs.tsv"
          failed=0
          while IFS=$'\t' read -r number title; do
            if ! fixed="$(node scripts/check-commits.mjs pr-title --base origin/main --fix -- "$title")"; then
              echo "::warning title=Refresh::Could not work out the version for #$number: $title"
              failed=$((failed + 1))
            elif [ "$fixed" != "$title" ]; then
              if gh pr edit "$number" --title "$fixed"; then
                echo "Retitled #$number: $fixed"
              else
                echo "::warning title=Refresh::Could not retitle #$number to: $fixed"
                failed=$((failed + 1))
              fi
            fi
          done < "$RUNNER_TEMP/open-prs.tsv"
          [ "$failed" -eq 0 ]
