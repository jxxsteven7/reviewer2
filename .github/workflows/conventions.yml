# Checks the commit and versioning convention (docs/rules/git.md and docs/rules/versioning.md)
# with scripts/check-commits.mjs.
#
# On a pull request: every commit in it, plus the PR title and body. The title becomes the squash
# commit on main, so it must carry the next version. The job fills the version in when it is
# missing or stale. GitHub doesn't allow that on a PR from a fork, so there the job fails and
# prints the title to use instead.
# On a push to main: the commits that just landed. A new minor or major version gets a tag and a
# GitHub Release. Then the open PRs get their versions refreshed, because every merge moves the
# next number on.
#
# PR metadata reaches the scripts only through `env:`. Never interpolate `github.event.*` into a
# `run:` script, which would allow script injection.

name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.ref }}
  # Never cancel a run on main: it may still have to tag a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request:
    # This name is a required status check; see docs/maintainers.md.
    name: Commits and version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to put the right version in the PR title
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version comes from the history of main and its tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Commits in the pull request
        run: node scripts/check-commits.mjs range "origin/$BASE_REF..$HEAD_SHA"
      - name: Pull request title and body
        run: |
          title="$(node scripts/check-commits.mjs pr-title "$PR_TITLE" --base "origin/$BASE_REF" --fix)"
          if [ "$title" != "$PR_TITLE" ]; then
            if gh pr edit "$PR_NUMBER" --title "$title"; then
              echo "Retitled the pull request: $title"
            else
              echo "::error title=Pull request title::Set the pull request title to: $title"
              exit 1
            fi
          fi
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/check-commits.mjs pr-title "$title" --base "origin/$BASE_REF" \
            --head-ref "$HEAD_REF" --body-file "$RUNNER_TEMP/pr-body.md"

  scripts:
    # This name is a required status check; see docs/maintainers.md.
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test "scripts/*.test.mjs"

  main:
    name: Landed commits and release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag a new minor or major version and publish its release
      pull-requests: write # to refresh the version in open PR titles
    env:
      BEFORE: ${{ github.event.before }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Commits that landed on main
        run: node scripts/check-commits.mjs head --base "$BEFORE"
      - name: Tag and release a new minor or major version
        run: |
          tag="$(node scripts/check-commits.mjs release)"
          if [ -n "$tag" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
            echo "Released $tag"
          fi
      - name: Refresh the version in open pull request titles
        if: ${{ !cancelled() }}
        run: |
          gh pr list --base main --state open --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
          while IFS=$'\t' read -r number title; do
            fixed="$(node scripts/check-commits.mjs pr-title "$title" --base origin/main --fix)"
            if [ "$fixed" != "$title" ]; then
              gh pr edit "$number" --title "$fixed"
              echo "Retitled #$number: $fixed"
            fi
          done
