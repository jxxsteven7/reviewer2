<!doctype html>
<!--
  The picture that previews of the site's links show, 1200 by 630 (public/share.png): the wordmark,
  the tagline in both languages, a pill, and Reviewer 2's card with the rejection stamped on it. The
  Chinese lines are set in ZCOOL KuaiLe first, for the height of their lines, which the first font
  sets.
  render.mjs draws it, with the texts of the locale files in place of the data-text attributes,
  and serves this page with the repository's files, the fonts and tokens.css among them.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/baloo-2/wght.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/noto-sans-sc/wght.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/zcool-kuaile/400.css" />
    <link rel="stylesheet" href="/client/src/styles/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg) radial-gradient(rgb(26 26 46 / 9%) 2px, transparent 2.5px) 6px 6px / 30px 30px;
        color: var(--ink);
        font-family: var(--font-sans);
        font-synthesis: none;
      }

      .wordmark {
        position: absolute;
        left: 76px;
        top: 58px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: var(--font-number);
        font-size: 40px;
        font-weight: 800;
      }

      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        border-radius: 16px;
        background: var(--ink);
        color: var(--on-ink);
        font-size: 26px;
        line-height: 1;
      }

      h1 {
        position: absolute;
        left: 72px;
        top: 160px;
        font-family: 'ZCOOL KuaiLe', var(--font-display);
        font-size: 94px;
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: 0.01em;
      }

      h2 {
        position: absolute;
        left: 76px;
        top: 288px;
        font-family: var(--font-display);
        font-size: 60px;
        font-weight: 800;
        line-height: 1;
      }

      .pill {
        position: absolute;
        left: 76px;
        top: 410px;
        padding: 12px 30px 14px;
        border: 4px solid var(--ink);
        border-radius: 999px;
        background: var(--paper);
        box-shadow: 6px 6px 0 var(--ink);
        font-size: 30px;
        font-weight: 800;
      }

      .card {
        position: absolute;
        left: 862px;
        top: 170px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 290px;
        height: 330px;
        padding-top: 92px;
        border-radius: 30px;
        background: var(--ink);
        color: var(--on-ink);
        box-shadow: 9px 9px 0 rgb(26 26 46 / 35%);
      }

      .card-tag {
        position: absolute;
        left: 22px;
        top: 18px;
        font-family: var(--font-number);
        font-size: 26px;
        font-weight: 800;
      }

      .card-word {
        font-family: 'ZCOOL KuaiLe', var(--font-display);
        font-size: 52px;
        line-height: 1.1;
      }

      .card-word-en {
        font-family: var(--font-number);
        font-size: 36px;
        font-weight: 800;
        line-height: 1.1;
      }

      .stamp {
        position: absolute;
        left: 145px;
        top: 250px;
        padding: 6px 24px;
        border: 7px double var(--red);
        border-radius: 14px;
        color: var(--red);
        font-family: var(--font-number);
        font-size: 46px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0.93;
        transform: translate(-50%, -50%) rotate(-10deg);
      }
    </style>
  </head>
  <body>
    <p class="wordmark"><span class="tile">R2</span><span data-text="en:app.name"></span></p>
    <h1 data-text="zh:app.tagline"></h1>
    <h2 data-text="en:app.tagline"></h2>
    <p class="pill">
      <span data-text="zh:site.picture.phones"></span> · <span data-text="en:site.picture.phones"></span>
    </p>
    <div class="card">
      <span class="card-tag">R2</span>
      <span class="card-word" data-text="zh:site.picture.card"></span>
      <span class="card-word-en" data-text="en:site.picture.card"></span>
      <span class="stamp" data-text="en:site.picture.stamp"></span>
    </div>
  </body>
</html>
